services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    expose: ["8000"]
    volumes:
      - data:/srv/data

  # Caddy obtient tout seul un certificat HTTPS gratuit (Let's Encrypt)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?manque SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  data:
  caddy_data:
  caddy_config:
