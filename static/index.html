<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clipping — YouTube → Shorts viraux</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="hero">
    <div class="logo">✂️ <span>Clipping</span></div>
    <h1>Transforme une vidéo YouTube en <em>shorts viraux</em></h1>
    <p class="sub">Colle un lien. L'IA repère les meilleurs moments, recadre en 9:16 et ajoute les sous-titres animés. Prêt pour TikTok, Reels et Shorts.</p>

    <form id="form" class="card">
      <div class="url-row">
        <input id="url" type="url" required placeholder="https://www.youtube.com/watch?v=…" autocomplete="off" />
        <button id="go" type="submit">Générer les shorts</button>
      </div>
      <details>
        <summary>Réglages</summary>
        <div class="grid">
          <label>Nombre de clips
            <input id="num" type="number" min="1" max="20" value="5" /></label>
          <label>Durée min (s)
            <input id="min" type="number" min="5" max="120" value="15" /></label>
          <label>Durée max (s)
            <input id="max" type="number" min="10" max="180" value="40" /></label>
          <label>Cadrage
            <select id="layout">
              <option value="auto">Automatique (recommandé)</option>
              <option value="gaming">Gaming (facecam en haut, jeu en bas)</option>
              <option value="crop">Toujours plein écran (suivi du visage)</option>
              <option value="blur">Vidéo entière + fond flou</option>
            </select></label>
          <label>Langue
            <select id="lang">
              <option value="">Détection auto</option>
              <option value="fr">Français</option>
              <option value="en">Anglais</option>
              <option value="es">Espagnol</option>
              <option value="de">Allemand</option>
              <option value="it">Italien</option>
              <option value="pt">Portugais</option>
            </select></label>
          <label class="check"><input id="subs" type="checkbox" checked /> Sous-titres animés</label>
          <label class="check"><input id="hq" type="checkbox" checked /> Qualité max 1440p (plus lent)</label>
        </div>
      </details>
      <p id="error" class="error" hidden></p>
    </form>
  </header>

  <main>
    <section id="current" hidden>
      <div class="card status">
        <div class="status-head">
          <h2 id="job-title">Traitement…</h2>
          <span id="job-engine" class="badge" hidden></span>
        </div>
        <div class="bar"><div id="bar-fill"></div></div>
        <p id="job-msg" class="muted"></p>
        <p id="job-note" class="warn" hidden></p>
      </div>
      <div id="clips" class="clips"></div>
    </section>

    <section id="history-wrap" hidden>
      <h3>Projets précédents</h3>
      <ul id="history" class="history"></ul>
    </section>
  </main>

  <template id="clip-tpl">
    <article class="clip">
      <div class="video-wrap">
        <video controls preload="none" playsinline></video>
        <div class="busy" hidden><span class="spinner"></span><span class="busy-msg"></span></div>
      </div>
      <div class="clip-body">
        <div class="clip-top">
          <span class="score"></span>
          <span class="time muted"></span>
        </div>
        <h4 class="title"></h4>
        <p class="reason muted"></p>
        <p class="clip-error warn" hidden></p>
        <textarea class="caption" readonly rows="3"></textarea>
        <div class="actions">
          <a class="btn dl" download>Télécharger</a>
          <button class="btn ghost copy" type="button">Copier la légende</button>
        </div>
        <button class="btn ghost edit-toggle" type="button">✏️ Modifier</button>

        <form class="editor" hidden>
          <div class="trim">
            <span class="trim-label">Début</span>
            <button type="button" class="step" data-field="start" data-delta="-1">−1 s</button>
            <output class="t-start"></output>
            <button type="button" class="step" data-field="start" data-delta="1">+1 s</button>
          </div>
          <div class="trim">
            <span class="trim-label">Fin</span>
            <button type="button" class="step" data-field="end" data-delta="-1">−1 s</button>
            <output class="t-end"></output>
            <button type="button" class="step" data-field="end" data-delta="1">+1 s</button>
          </div>
          <p class="muted small t-dur"></p>
          <label>Accroche (texte en haut, laisse vide pour aucune)
            <input class="e-hook" type="text" maxlength="120" /></label>
          <label>Sous-titres (corrige les mots mal écrits)
            <textarea class="e-text" rows="4"></textarea></label>
          <label>Cadrage
            <select class="e-layout">
              <option value="auto">Automatique</option>
              <option value="gaming">Gaming (facecam en haut, jeu en bas)</option>
              <option value="crop">Plein écran (suivi du visage)</option>
              <option value="blur">Vidéo entière + fond flou</option>
            </select></label>
          <p class="muted small">Si tu changes le début ou la fin, les sous-titres se mettent à jour après le montage.</p>
          <div class="actions">
            <button type="submit" class="btn">🎬 Refaire le clip</button>
            <button type="button" class="btn ghost cancel">Annuler</button>
          </div>
        </form>
      </div>
    </article>
  </template>

  <script src="/app.js"></script>
</body>
</html>
